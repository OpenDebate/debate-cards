services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.2.3
    env_file: .env
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
    healthcheck:
      test: curl -s http://elasticsearch:9200 > /dev/null || exit 1
    ports:
      - 9200:9200
    volumes:
      - elastic:/usr/share/elasticsearch/data
  postgres:
    image: postgres:14
    command: postgres -c wal_level=logical -c max_replication_slots=2
    env_file: .env
    expose:
      - 5432
    healthcheck:
      test: pg_isready -U postgres
    ports:
      - 5432:5432
    volumes:
      - db:/var/lib/postgresql/data
  redis:
    image: redis:7
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: redis-cli ping
    ports:
      - 6379:6379
    expose:
      - 6379
    volumes:
      - redis:/data
  tasks:
    build: .
    command: npm run start:tasks
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    ports:
      - 9229:9229
    profiles:
      - tasks
    volumes:
      - ${DOCUMENT_PATH:-./documents}:/app/documents
  api:
    build: .
    command: node ./build/modules/api
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    ports:
      - 4000:4000
      - 5555:5555
      - 9230:9230
    expose:
      - 4000
    volumes:
      - ./src:/app/src

volumes:
  db: {}
  elastic: {}
  redis: {}
