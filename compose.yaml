x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ELASTICSEARCH_URL: http://elasticsearch:9200
    REDIS_URL: redis://redis:6379

services:
  elasticsearch:
    # 8.2.x-8.4.x bundle a JDK that crashes at startup on hosts with newer cgroup controllers
    # (NullPointerException in CgroupInfo.getMountPoint); 8.15+ start fine.
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.6
    env_file: .env
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
      - ingest.geoip.downloader.enabled=false
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    healthcheck:
      test: curl -s http://elasticsearch:9200 > /dev/null || exit 1
    # Bound to localhost: elasticsearch runs with security disabled, so it must not be reachable from the network
    ports:
      - 127.0.0.1:9200:9200
    volumes:
      - elastic:/usr/share/elasticsearch/data
  postgres:
    image: postgres:14
    command:
      [
        "postgres",
        "-c",
        "wal_level=logical",
        "-c",
        "max_wal_senders=2",
        "-c",
        "max_replication_slots=2",
        "-c",
        "password_encryption=md5",
      ]
    env_file: .env
    # pgsync 2.3.2 authenticates with md5 only
    environment:
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: --auth-host=md5
    expose:
      - 5432
    healthcheck:
      test: pg_isready -U postgres
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - db:/var/lib/postgresql/data
  redis:
    image: redis:7
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: redis-cli ping
    ports:
      - 127.0.0.1:6379:6379
    expose:
      - 6379
    volumes:
      - redis:/data

  # Applies prisma migrations, then exits. Everything else waits on it.
  migrate:
    <<: *app
    command: npx prisma migrate deploy
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  pgsync:
    # Built locally: upstream pgsync 2.3.2 needs the patches in pgsync/patches
    build:
      context: .
      dockerfile: pgsync/Dockerfile
    entrypoint: ["sh", "-c", "bootstrap --config ./schema.json && pgsync --config ./schema.json -d"]
    sysctls:
      - net.ipv4.tcp_keepalive_time=200
      - net.ipv4.tcp_keepalive_intvl=200
      - net.ipv4.tcp_keepalive_probes=5
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PG_USER: ${POSTGRES_USER}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_SCHEME: http
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${REDIS_PASSWORD}
      ELASTICSEARCH: "true"
      SCHEMA: /app/schema.json
      QUERY_CHUNK_SIZE: 1000
      POLL_TIMEOUT: 3
      LOG_LEVEL: INFO
      # Evidence docs carry fulltext + markup (~20KB each), so the stock 100MB
      # bulk chunk and 10s read timeout make elastic time out under load.
      ELASTICSEARCH_TIMEOUT: 120
      ELASTICSEARCH_CHUNK_SIZE: 200
      ELASTICSEARCH_MAX_CHUNK_BYTES: 10485760
      ELASTICSEARCH_STREAMING_BULK: "true"
      ELASTICSEARCH_MAX_RETRIES: 3
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./pgsync/schema.json:/app/schema.json
  api:
    <<: *app
    command: node ./build/modules/api
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - 4000:4000
    expose:
      - 4000
  tasks:
    <<: *app
    command: node ./build/tasks.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - ${DOCUMENT_PATH:-./documents}:/app/documents
      - ${CACHE_PATH:-./cache}:/app/cache
      - ./logs:/app/logs

  # One-shot job loader. Not started by `up`; run explicitly, e.g.
  #   docker compose run --rm loader openev 2024
  loader:
    <<: *app
    profiles: ["tools"]
    entrypoint: ["node", "./build/index.js"]
    command: ["openev", "2024"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ${DOCUMENT_PATH:-./documents}:/app/documents
      - ${CACHE_PATH:-./cache}:/app/cache

volumes:
  db: {}
  elastic: {}
  redis: {}
